<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Image Example</title>
  <style>
    .profile-photo {
      width: 150px;     /* Set the width to 150 pixels */
      height: 150px;    /* Set the height to 150 pixels */
      object-fit: cover; /* Keep the image from distorting, fill the container */
      border-radius: 50%; /* Make the image round (remove this for square) */
      border: 2px solid #333; /* Add a border for better appearance */
    }
  </style>
</head>
<body>

  <h2>Client Profile</h2>
  <img src="https://via.placeholder.com/300" alt="Client Profile Photo" class="profile-photo">

</body>
</html>
