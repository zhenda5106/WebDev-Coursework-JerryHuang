<!DOCTYPE html>
<html>
<head>
    <title>Client Profile Page</title>
    <style>
        body {
            background-image: url('VSCodeIcon.jpg');
            background-size: cover;
            background-position: center;
        }
        h1 {
            color: red;
        }
        p {
            color: blue;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
        }
        img.profile-photo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <h1>Client Profile</h1>
    <p>This is a sample profile page for a client.</p>
    <img src="https://via.placeholder.com/300" alt="Client Photo" class="profile-photo">
</body>
</html>
